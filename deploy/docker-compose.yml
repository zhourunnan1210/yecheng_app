# ==========================================
# 椰城项目 - 完整云端部署编排
#
# 使用：
#   cp .env.example .env   # 先填好密码
#   docker-compose up -d --build
#
# 密码类变量用 ${VAR:?消息} 语法，未设置会直接报错退出，
# 避免用默认弱口令把服务暴露到公网。
# ==========================================

version: "3.8"

services:
  # ----------------------------------------
  # 1. MySQL 8.0 数据库
  # ----------------------------------------
  mysql:
    image: mysql:8.0
    container_name: yecheng-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: yecheng_app_2604
      MYSQL_USER: ${MYSQL_USER:-yecheng}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      # 仅在需要从外部工具（Navicat 等）连库时暴露，且建议在安全组里限制来源 IP
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动时自动导入建表与示例数据（SQL 只有一份，放在 ../database）
      - ../database:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - yecheng-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # 2. Redis 缓存
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: yecheng-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    ports:
      # 同上，建议在安全组里限制来源 IP
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - yecheng-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ----------------------------------------
  # 3. Java 后端 API
  # ----------------------------------------
  yecheng-app:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: yecheng-app
    restart: always
    ports:
      - "10086:10086"
    environment:
      # 激活 dev 配置（Docker 内网通信）
      SPRING_PROFILES_ACTIVE: dev
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: yecheng_app_2604
      DB_USERNAME: ${MYSQL_USER:-yecheng}
      DB_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      # 文件存储路径
      BASE_CACHE_DIR: /app/cache
      # 阿里云 OSS（图片上传，留空则上传接口不可用）
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      # 文本向量服务（仓库未包含，需另部署；不配置则语义搜索降级）
      EMBEDDING_SERVICE_URL: ${EMBEDDING_SERVICE_URL:-http://textembed:5000}
      # 允许跨域的前端来源
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    volumes:
      - app_cache:/app/cache
    networks:
      - yecheng-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------
  # 4. Python 数字水印服务
  #
  # 注意：当前 Dockerfile 构建的是 LSB-only 版本
  # （只装 stegano 库、只跑 ImgStegano_cloud.py，不含 SteganoGAN）。
  # 仓库里的 worker_encode_cloud.py / ImgStegano.py / worker_encode.py
  # 是带 SteganoGAN 的完整版本，需要自行补依赖后使用。
  # 详见 watermark-service/USAGE_GUIDE.md
  # ----------------------------------------
  imgstegano:
    build:
      context: ../watermark-service
      dockerfile: Dockerfile
    container_name: yecheng-watermark
    restart: always
    ports:
      - "5001:5001"
    environment:
      # Redis 配置（Docker 内网连接 redis 容器）
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      REDIS_DB: 0
      # 缓存目录（与 Java 后端共享卷）
      BASE_CACHE_DIR: /app/cache
      WATERMARK_ENCODER_DIR: /app/cache/watermark/encoder
      WATERMARK_DECODER_DIR: /app/cache/watermark/decoder
      # ImgStegano 路径配置
      INPUT_DIR: /app/cache/input_pictures
      ENCODED_DIR: /app/cache/encoded_pictures
      DECODED_DIR: /app/cache/decoded_pictures
      ENCODER_OUTPUT_DIR: /app/cache/watermark/encoder
      # Flask 配置
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5001
    volumes:
      - app_cache:/app/cache
    networks:
      - yecheng-net
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ----------------------------------------
  # 5. Nginx 网关（前端静态资源 + API 反向代理）
  # ----------------------------------------
  nginx:
    image: nginx:alpine
    container_name: yecheng-nginx
    restart: always
    ports:
      - "80:80"
      # 443 需要先在 nginx/nginx.conf 里放开 HTTPS server 块并放入证书
      - "443:443"
    volumes:
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - yecheng-net
    depends_on:
      yecheng-app:
        condition: service_started

# ----------------------------------------
# 数据卷持久化
# ----------------------------------------
volumes:
  mysql_data:
  redis_data:
  app_cache:

# ----------------------------------------
# 内网通信
# ----------------------------------------
networks:
  yecheng-net:
    driver: bridge
