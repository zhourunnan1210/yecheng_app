spring:
  datasource:
    druid:
      db-type: com.alibaba.druid.pool.DruidDataSource
      driverClassName: com.p6spy.engine.spy.P6SpyDriver
      # 本地数据库连接配置（按需修改，或通过环境变量注入）
      url: jdbc:p6spy:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:yecheng_app_2604}?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=CONVERT_TO_NULL&useSSL=false&allowPublicKeyRetrieval=true
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:}
      # 初始连接数，建议设置为与最小空闲连接数相同
      initial-size: 20
      # 最小空闲连接数，保持足够的空闲连接以应对请求
      min-idle: 20
      # 最大连接数，根据并发需求适当增加
      max-active: 50
      # 获取连接超时时间（毫秒），调整以满足响应时间要求
      max-wait: 3000
      # 启用KeepAlive机制，保持长连接
      keep-alive: true
      # 连接有效性检测间隔时间（毫秒），定期检查连接的健康状态
      time-between-eviction-runs-millis: 60000
      # 连接在池中最小生存时间（毫秒），确保连接在池中至少存在一段时间
      min-evictable-idle-time-millis: 300000
      # 连接在池中最大生存时间（毫秒），防止连接在池中停留过长
      max-evictable-idle-time-millis: 900000
      # 指明连接是否被空闲连接回收器(如果有)进行检验.如果检测失败,则连接将被从池中去除
      test-while-idle: true
      # 指明是否在从池中取出连接前进行检验,如果检验失败, 则从池中去除连接并尝试取出另一个
      test-on-borrow: true
      # 是否在归还到池中前进行检验
      test-on-return: false
      # 停用 com_ping 探活机制
      use-ping-method: false
      # 检测连接是否有效
      validation-query: SELECT 1
      # 配置监控统计
      webStatFilter:
        enabled: true
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
      filter:
        stat:
          enabled: true
          # 记录慢SQL
          log-slow-sql: true
          slow-sql-millis: 2000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB
  redis:
    # 本地Redis配置（WSL Ubuntu 中运行）
    host: localhost
    port: 6379
    database: 0
    password:
    timeout: 10s
    lettuce:
      pool:
        min-idle: 0
        max-idle: 8
        max-active: 8
        max-wait: -1ms

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto #自增
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.hnu.highlynewapp: debug

server:
  port: 10086

embedding:
  service:
    url: ${EMBEDDING_SERVICE_URL:http://127.0.0.1:5000}

# Add a configuration section for steganography service
stegano:
  service:
    url: ${STEGANO_SERVICE_URL:http://127.0.0.1:5001}
  polling:
    timeout: 300  # 轮询超时时间（秒），默认5分钟
    interval: 2   # 轮询间隔（秒），默认2秒
  output-dir: ${STEGANO_OUTPUT_DIR:${storage.base-dir}/watermark/encoder}
storage:
  # 本地文件暂存目录，按需修改
  base-dir: ${BASE_CACHE_DIR:./cache}
  input-dir: ${INPUT_DIR:${storage.base-dir}/input_pictures}
  encoded-dir: ${ENCODED_DIR:${storage.base-dir}/encoded_pictures}
  decoded-dir: ${DECODED_DIR:${storage.base-dir}/decoded_pictures}
  image-dir: ${IMAGE_DIR:${storage.base-dir}}

# Watermark configuration
watermark:
  visible:
    enabled: true
    text: "yecheng_APP@HNU"
    color: "PINK"
    opacity: 1.0
  stegano:
    prefix: "yecheng_APP@HNU-"
