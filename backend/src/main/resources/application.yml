spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB
#  redis:
#    # 地址
#    host: 127.0.0.1
#    # 端口，默认为6379
#    port: 6379

#  docker容器化配置
  redis:
    # 地址（Docker 内为 redis 容器名，本地开发可覆盖为 localhost）
    host: ${REDIS_HOST:redis}
    # 端口，默认为6379
    port: ${REDIS_PORT:6379}

    # 数据库索引
    database: 0
    # 密码（通过环境变量 REDIS_PASSWORD 注入）
    password: ${REDIS_PASSWORD:}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto #自增
      logic-delete-value: 1
      logic-not-delete-value: 0
logging:
  level:
    com.hnu.highlynewapp: debug
server:
  port: 10086


