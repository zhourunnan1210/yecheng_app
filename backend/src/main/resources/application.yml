#docker容器化配置
embedding:
  service:
    # 文本向量服务（语义搜索/推荐用）。本仓库未包含该服务，需自行部署。
    url: ${EMBEDDING_SERVICE_URL:http://textembed:5000}
# Add a configuration section for steganography service
stegano:
  service:
    url: ${STEGANO_SERVICE_URL:http://imgstegano:5001}
  polling:
    timeout: 300  # 轮询超时时间（秒），默认5分钟
    interval: 2   # 轮询间隔（秒），默认2秒
  output-dir: ${STEGANO_OUTPUT_DIR:${storage.base-dir}/watermark/encoder}

storage:
  # 容器内共享的图片暂存目录（与 docker-compose 的 app_cache 卷对应）
  base-dir: ${BASE_CACHE_DIR:/app/cache}
  input-dir: ${INPUT_DIR:${storage.base-dir}/input_pictures}
  encoded-dir: ${ENCODED_DIR:${storage.base-dir}/encoded_pictures}
  decoded-dir: ${DECODED_DIR:${storage.base-dir}/decoded_pictures}
  image-dir: ${IMAGE_DIR:${storage.base-dir}}

# Watermark configuration
watermark:
  visible:
    enabled: true
    text: "yecheng_APP@HNU"
    color: "PINK"
    opacity: 1.0
  stegano:
    prefix: "yecheng_APP@HNU-"

# 阿里云 OSS 对象存储（图片上传）
# 请通过环境变量注入 AccessKey，切勿写进配置文件提交到仓库
oss:
  endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
  bucket-name: ${OSS_BUCKET_NAME:your-bucket-name}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  # 业务代码用它判断图片 URL 是否指向本桶，由上面两项拼接而成
  bucket-domain: ${oss.bucket-name}.${oss.endpoint}

# CORS 允许的前端来源，逗号分隔。部署时改成你的实际域名
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
